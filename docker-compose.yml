services:
  mongodb:
    image: mongo:8
    container_name: verivault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - verivault_mongo:/data/db

  backend:
    build: ./backend
    container_name: verivault-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  verivault_mongo:
